  <script>
/* Pure rules for a PRD-based portfolio demonstration.
   No model, grading engine, student data or corporate API is used. */
(function (root) {
  'use strict';
  /** @param {{subject?:string,permission?:boolean,layout?:string,overridePure?:boolean,step?:boolean,print?:boolean}} input */
  function resolveMath(input = {}) {
    const s = Object.assign({subject:'math', permission:true, layout:'combined', overridePure:false, step:false, print:true}, input);
    const reasons = [];
    if (s.subject !== 'math') reasons.push('本 PRD 的适用学科为数学。');
    if (!s.permission) reasons.push('未开通步骤批配置，不满足前置条件。');
    if (s.layout !== 'combined') reasons.push('版式不是题卡合一，不满足前置条件。');
    if (s.overridePure) reasons.push('后台已将版式改为纯卡，不进入步骤批引擎。');
    if (reasons.length) return {eligible:false, useStep:false, printAvailable:false, output:'unavailable', reasons};
    if (!s.step) return {eligible:true, useStep:false, printAvailable:false, output:'small', reasons:[]};
    return {eligible:true, useStep:true, printAvailable:true, output:s.print ? 'steps' : 'whole', reasons:[]};
  }
  /** Only the required-selection gate is a product rule.
      mismatch is an educational observation, NOT an engine validation. */
  function resolveScan({selected=null, actual='pure'} = {}) {
    return {allowed:selected==='pure'||selected==='combined', mismatch:selected!==null&&selected!==actual};
  }
  function mathChecks(){
    return [
      ['默认不启用步骤批 → 小题结果', {}, 'small'],
      ['启用步骤批并留痕 → 整题＋步骤', {step:true,print:true}, 'steps'],
      ['关闭步骤留痕 → 仅整题，不恢复小题分', {step:true,print:false}, 'whole'],
      ['纯卡不进入此步骤批路径', {step:true,layout:'pure'}, 'unavailable'],
      ['后台改为纯卡 → 不进入步骤批', {step:true,overridePure:true}, 'unavailable'],
      ['未开通配置 → 不进入此路径', {step:true,permission:false}, 'unavailable'],
      ['非数学学科 → 不属于本演示范围', {step:true,subject:'english'}, 'unavailable'],
      ['不启用步骤批 → 不提供步骤留痕选项', {step:false}, 'small']
    ].map(([label,input,expected])=>({label,pass:resolveMath(input).output===expected && (input.step!==false || !resolveMath(input).printAvailable)}));
  }
  const api={resolveMath,resolveScan,mathChecks};
  root.PortfolioRules=api;
  if(typeof module!=='undefined' && module.exports) module.exports=api;
})(typeof window!=='undefined'?window:globalThis);

</script>

function answerPaper(result){
 if(!result.eligible) return `<div class="empty-output"><div class="large-symbol" aria-hidden="true">↳</div><h4>不进入本步骤批路径</h4><p>${result.reasons.map(escape).join('<br>')}</p><p style="margin-top:13px">其他处理结果不在本 PRD 的规则演示范围内。</p></div><div class="output-caption">能力范围之外，不补造批改结果。</div>`;
 const small=result.output==='small', steps=result.output==='steps';
 const resultText=small?'小题批改结果':steps?'整题结果 ＋ 步骤结果':'仅整题批改结果';
 return `<div class="answer-paper">${eyebrow('ILLUSTRATIVE ANSWER SHEET')}<h4>数学 · 公共作答区</h4><p class="problem-text">演示题：已知 y = x² − 2x + 1。<br>（1）配方；（2）求导。</p><div class="equation"><div><span>(1) y = (x − 1)²</span>${small?'<span class="mark">✓</span>':''}</div><div><span>(2) y′ = 2x + 2</span>${small?'<span class="mark">×</span>':''}</div></div>${steps?'<div class="annotation">步骤反馈示意：<br>配方正确；求导时 −2x 的导数应为 −2。</div>':''}<div class="paper-result"><b>${resultText}</b><br>${small?'按小题展示勾叉／分数（此处仅示意勾叉）。':steps?'整题勾叉／分数，以及步骤批注。':'只隐藏步骤结果；不会重新生成小题分。'}</div></div><div class="output-caption">结果示意 · ${small?'不执行步骤批':steps?'执行步骤批，展示步骤':'执行步骤批，隐藏步骤'}</div>`;
}
function renderMath(){
 if(!$('#mathLab')) return;
 const result=R.resolveMath(math);
 const step=$('#step-switch'), print=$('#print-switch');
 step.setAttribute('aria-checked',String(math.step)); step.disabled=!result.eligible;
 print.setAttribute('aria-checked',String(math.print));
 $('#printControl').hidden=!result.printAvailable;
 $('#printUnavailable').hidden=result.printAvailable;
 $('#printUnavailable').textContent=result.eligible?'未走步骤批路径，不提供步骤留痕选项。':'当前不满足步骤批条件，相关留痕行为不在本演示范围内。';
 $('#mathModeNote').textContent=result.eligible?(math.step?'已选择：本次作业进入步骤批路径。':'未选择：本次作业不走步骤批路径。'):'适用条件不满足，请展开下方条件查看。';
 $('#mathOutput').innerHTML=answerPaper(result);
 $('#mathPipeline').innerHTML=result.eligible?`<div class="node">扫描前选择<br>${math.step?'启用步骤批':'不启用步骤批'}</div><span>→</span><div class="node active">${math.step?'步骤批引擎':'非步骤批路径'}</div><span>→</span><div class="node">${result.output==='small'?'小题结果':result.output==='steps'?'整题＋步骤':'仅整题结果'}</div>`:'<div class="node active">前置条件不满足</div><span>→</span><div class="node">不进入本步骤批路径</div>';
 $('#math-user').value=math.user; $('#math-device').value=math.device;
 $('#math-subject').value=math.subject; $('#math-layout').value=math.layout;
 $('#math-permission').checked=math.permission; $('#math-override').checked=math.overridePure;
 notifyHeight();
}

function renderScan(message){
 if(!$('#scanLab'))return;
 $$('[data-version]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.version===scan.version)));
 $$('[data-layout-choice]').forEach(el=>el.setAttribute('aria-checked',String(el.dataset.layoutChoice===scan.selected)));
 $('#scan-actual').value=scan.actual;
 $('#scanPaper').innerHTML=`<div class="source-paper"><h5>${scan.actual==='pure'?'数学练习 · 答题卡':'数学练习 · 题卡合一'}</h5>${scan.actual==='combined'?'<div class="stem">1. 已知函数 y = x² − 2x + 1，请完成配方并求导。</div>':''}<div class="blanks">（1）________<br>（2）________<br>（3）________</div></div>`;
 $('#scanButton').setAttribute('aria-disabled',String(!R.resolveScan(scan).allowed));
 $('#scanSelectionNote').textContent=scan.version==='old'?'初版进入时默认题卡合一，可手动切换。':'优化版进入时无默认选择，需主动确认。';
 $('#scanHelp').hidden=!scan.help;
 const feedback=$('#scanFeedback');
 feedback.className='scan-feedback';
 if(message){ feedback.classList.toggle('warning',!!message.warning); feedback.innerHTML=`<strong>${message.title}</strong>${message.text}`; }
 else if(!scan.selected)feedback.innerHTML='<strong>请先选择作业版式</strong>你仍可点击灰色扫描按钮，查看必选提示与示例。';
 else feedback.innerHTML=`<strong>当前选择：${scan.selected==='pure'?'答题卡':'题卡合一'}</strong>${scan.version==='old'?'这里可能只是沿用了默认值。':'已完成版式确认。'}点击扫描，观察这次选择与示意纸张之间的关系。`;
 notifyHeight();

 renderScan({warning:s.mismatch,title:'扫描任务进入后续流程（演示）',text:s.mismatch?'演示观察：所选版式与左侧示意纸张不一致。取消默认并不能自动消除误选；这里的风险说明不是原系统的自动识别或拦截。':'演示观察：所选版式与左侧示意纸张一致。此处只验证了页面选择，不代表真实划题或批改成功。'});

// Single delegated event handler keeps all routes usable without a build tool.
document.addEventListener('click',e=>{
 const source=e.target.closest('[data-source]');if(source){showSource(source.dataset.source);return;}
 const version=e.target.closest('[data-version]');if(version){scan.version=version.dataset.version;scan.selected=scan.version==='old'?'combined':null;scan.help=false;renderScan();return;}
 const choice=e.target.closest('[data-layout-choice]');if(choice){scan.selected=choice.dataset.layoutChoice;renderScan();return;}
 const rtab=e.target.closest('[data-research-tab]');if(rtab){researchTab=rtab.dataset.researchTab;renderResearch();return;}
 const evaltab=e.target.closest('[data-evaluation]');if(evaltab){evaluationTab=evaltab.dataset.evaluation;renderEvaluation();return;}
 const task=e.target.closest('[data-task]');if(task){taskIndex=Number(task.dataset.task);renderTask();return;}
 const closeGuide=e.target.closest('[data-close-guide]');if(closeGuide){closeDialog();return;}
 const b=e.target.closest('[data-action]');if(!b)return;
 switch(b.dataset.action){
 case 'skip':e.preventDefault();main.focus({preventScroll:true});main.scrollIntoView({behavior:'instant'});break;
 case 'guide':guideIndex=0;showGuide();break;
 case 'guide-prev':guideIndex=Math.max(0,guideIndex-1);showGuide();break;
 case 'guide-next':guideIndex=Math.min(3,guideIndex+1);showGuide();break;
 case 'sources':showSource();break;
 case 'close-dialog':closeDialog();break;
 case 'top':window.scrollTo({top:0,behavior:reducedMotion?'instant':'smooth'});break;
 case 'math-step':if(!R.resolveMath(math).eligible)break;math.step=!math.step;preferences[profileKey()]=math.step;renderMath();break;
 case 'math-print':math.print=!math.print;renderMath();break;
 case 'math-reset':resetMath();toast('已清除本页演示选择');break;
 case 'math-check':{
   const results=R.mathChecks();const el=$('#mathTestResults');el.hidden=false;el.innerHTML=`<strong>本网页规则自检：${results.filter(x=>x.pass).length} / ${results.length} 通过</strong><p class="small" style="font-size:10px">由本次网页制作新增的确定性分支测试，非模型评测。</p>`+results.map(t=>`<div><span>${escape(t.label)}</span><b>${t.pass?'✓ 通过':'× 未通过'}</b></div>`).join('');notifyHeight();break;}
 case 'scan-reset':scan.selected=scan.version==='old'?'combined':null;scan.help=false;renderScan();toast('已重置当前版本演示');break;
 case 'scan-example':scan.help=!scan.help;renderScan();break;
 case 'scan-run':scanRun();break;
 }
});
document.addEventListener('change',e=>{

 case 'math-user':math.user=e.target.value;math.step=preferences[profileKey()]??false;renderMath();break;
 case 'math-device':math.device=e.target.value;math.step=preferences[profileKey()]??false;renderMath();break;
 case 'math-subject':math.subject=e.target.value;renderMath();break;
 case 'math-layout':math.layout=e.target.value;renderMath();break;
 case 'math-permission':math.permission=e.target.checked;renderMath();break;
 case 'math-override':math.overridePure=e.target.checked;renderMath();break;
 case 'scan-actual':scan.actual=e.target.value;scan.selected=scan.version==='old'?'combined':null;scan.help=false;renderScan();break;
 case 'scope-grade':case 'scope-subject':scopeContent();notifyHeight();break;
 }
});
dialog.addEventListener('close',()=>{document.body.style.overflow='';notifyHeight();});
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
document.addEventListener('keydown',e=>{
 if(dialog.open && $('#dialogEyebrow').textContent.startsWith('QUICK TOUR')){
   if(e.key==='ArrowRight'&&guideIndex<3){e.preventDefault();guideIndex++;showGuide();}
   if(e.key==='ArrowLeft'&&guideIndex>0){e.preventDefault();guideIndex--;showGuide();}
   return;
 }
 // Arrow navigation for native-like tabs and radio groups.
 const active=document.activeElement;
 const group=active?.closest('[role="tablist"],[role="radiogroup"]');
 if(group&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){
   const buttons=$$('button',group);const at=buttons.indexOf(active);if(at<0)return;
   e.preventDefault();let to=e.key==='Home'?0:e.key==='End'?buttons.length-1:(at+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+buttons.length)%buttons.length;
   buttons[to].focus();buttons[to].click();
 }
});

function getRoute(){let parts=location.hash.replace(/^#\/?/,'').split('/');return {name:['math','layout','research'].includes(parts[0])?parts[0]:'',section:parts[1]||''};}
function route(){
 const {name,section}=getRoute();
 const changed=name!==currentRoute;
 if(changed){
  if(dialog.open)closeDialog();
  if(observer)observer.disconnect();if(tocObserver)tocObserver.disconnect();
  currentRoute=name;
  main.innerHTML=name==='math'?mathView():name==='layout'?layoutView():name==='research'?researchView():home();
  document.title=({'math':'数学步骤批改','layout':'答题卡版式优化','research':'AI 教育产品研究'}[name]||'产品实习作品')+' · 科大讯飞';
  if(name==='math')renderMath();if(name==='layout')renderScan();if(name==='research')renderResearch();
  setupObservers();main.focus({preventScroll:true});
 }
 requestAnimationFrame(()=>{
  const target=section?document.getElementById(section):null;
  if(target)target.scrollIntoView({behavior:changed||reducedMotion?'instant':'smooth',block:'start'});
  else if(changed)window.scrollTo({top:0,behavior:'instant'});
  updateProgress();notifyHeight();
  if(changed&&!section)sendParent('iflytek:navigate',{});
 });
}
function setupObservers(){
 if('IntersectionObserver'in window){
  observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-visible');observer.unobserve(entry.target);}}),{threshold:.08});
  $$('.reveal').forEach(el=>observer.observe(el));
  tocObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){$$('[data-section-link]').forEach(a=>{const current=a.dataset.sectionLink===entry.target.id;a.classList.toggle('active',current);if(current)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}});},{rootMargin:'-10% 0px -65% 0px',threshold:0});
  $$('.case-section').forEach(el=>tocObserver.observe(el));
 }
}
function updateProgress(){const max=document.documentElement.scrollHeight-window.innerHeight;$('#progressBar').style.width=(max>0?Math.min(100,Math.max(0,100*window.scrollY/max)):0)+'%';}
let heightTimer;
function validParentOrigin(){try{const raw=params.get('parentOrigin');if(!raw)return null;const u=new URL(raw);return /^https?:$/.test(u.protocol)&&u.origin===raw?raw:null;}catch{return null;}}
const parentOrigin=validParentOrigin();
function sendParent(type,payload){if(window.parent!==window && parentOrigin)window.parent.postMessage(Object.assign({type},payload),parentOrigin);}
function notifyHeight(){clearTimeout(heightTimer);heightTimer=setTimeout(()=>{const footer=$('.site-footer');const height=Math.ceil(footer.getBoundingClientRect().bottom+window.scrollY+2);sendParent('iflytek:resize',{height});},100);}
window.addEventListener('hashchange',route);
window.addEventListener('scroll',updateProgress,{passive:true});
window.addEventListener('resize',()=>{updateProgress();notifyHeight();},{passive:true});
document.addEventListener('toggle',notifyHeight,true);
if('ResizeObserver'in window)new ResizeObserver(notifyHeight).observe(main);
route();
})();

</script>
