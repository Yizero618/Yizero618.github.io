/* Standalone shell and embedded portfolio use the same dependency-free prototype. */
:root { color-scheme: light; }
html, body { margin: 0; padding: 0; width: 100%; background: #f7f4f0; }
body { overflow-x: hidden; }
#demo-page { box-sizing: border-box; max-width: 1160px; margin: 0 auto; padding: 28px; }

<body>
<main id="demo-page">
<div id="tcl-quickcut-concept">
  <div class="preview-heading">
    <span>播放器内的 AI 快剪</span>
    <span class="concept-label">项目复盘原型 · 示例内容</span>
  </div>
  <nav class="preview-routes" aria-label="查看不同交互页面">
    <button type="button" data-route="entry" aria-pressed="true">播放入口</button>
    <button type="button" data-route="intro" aria-pressed="false">首次说明</button>
    <button type="button" data-route="quick" aria-pressed="false">快剪播放</button>
    <button type="button" data-route="source" aria-pressed="false">切回原片</button>
    <button type="button" data-route="end" aria-pressed="false">播完衔接</button>
  </nav>

  <section class="tv-screen" aria-label="TCL 电视 AI 快剪概念播放器">
    <div class="film-scene" aria-hidden="true">
      <div class="window-light"></div>
      <div class="window-frame"></div>
      <div class="city city-one"></div>
      <div class="city city-two"></div>
      <div class="city city-three"></div>

<script>
(function () {
  'use strict';
  const root = document.getElementById('tcl-quickcut-concept');
  if (!root) return;
  const screen = root.querySelector('.tv-screen');
  const controls = root.querySelector('#tcl-controls');
  const overlay = root.querySelector('#tcl-overlay');
  const progress = root.querySelector('#tcl-progress');
  const modeLabel = root.querySelector('#tcl-mode-label');
  const modeDescription = root.querySelector('#tcl-mode-description');
  const modeButton = root.querySelector('#tcl-mode-button');
  const playButton = root.querySelector('#tcl-play-button');
  const subtitle = root.querySelector('#tcl-subtitle');
  const toastElement = root.querySelector('#tcl-toast');
  const showButton = root.querySelector('#tcl-show-controls');
  const episodeInfo = {
    8: { original: 2700, quick: 720 },
    9: { original: 2640, quick: 660 },
    10: { original: 2700, quick: 0 }
  };
  const baseSegments = [
    { q0: 0, q1: 100, o0: 15, context: 0 },
    { q0: 100, q1: 220, o0: 604, context: 600 },
    { q0: 220, q1: 340, o0: 1020, context: 1000 },
    { q0: 340, q1: 470, o0: 1530, context: 1500 },
    { q0: 470, q1: 610, o0: 2030, context: 2010 },
    { q0: 610, q1: 720, o0: 2530, context: 2500 }
  ];
  let episode = 8, mode = 'original', position = 638, savedQuick = null;
  let playing = true, controlsVisible = true, modal = null, route = 'entry';
  let introduced = false, toastTimer = null, modalStack = [];
  let playerFocusAction = 'mode', playbackTimer = null, destroyed = false;
  let inViewport = true, heightFrame = null, lastReportedHeight = 0;
  const demoPage = document.getElementById('demo-page');
  const parentOrigin = window.location.origin === 'null' ? '*' : window.location.origin;
  const RESIZE_MESSAGE = 'tcl-quickcut:resize';

  const iconPaths = {
    'chevron-left': '<path d="m15 18-6-6 6-6"/>',
    'chevron-down': '<path d="m6 9 6 6 6-6"/>',
    'pause': '<path d="M8 5v14M16 5v14" stroke-width="3"/>',
    'play': '<path d="m8 5 11 7-11 7Z" fill="currentColor" stroke-width="1.5"/>',
    'sparkles': '<path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6Z"/><path d="M20 2v4M18 4h4"/>',
    'list-video': '<path d="M4 5h16M4 10h10M4 15h7M4 20h7"/><path d="m16 13 5 3.5-5 3.5Z"/>',
    'film': '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4M7 12h10"/>'
  };
  function icons() {
    root.querySelectorAll('i[data-icon]').forEach(function (element) {
      const path = iconPaths[element.dataset.icon] || iconPaths.play;
      element.outerHTML = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + path + '</svg>';
    });
  }
  function reportHeight() {
    if (destroyed || heightFrame !== null) return;
    heightFrame = requestAnimationFrame(function () {
      heightFrame = null;
      // Measure natural content, never iframe viewport height: the parent can shrink too.
      const height = Math.max(320, Math.ceil(demoPage.getBoundingClientRect().height));
      if (height === lastReportedHeight) return;
      lastReportedHeight = height;
      if (window.parent !== window) {
        window.parent.postMessage({ type: RESIZE_MESSAGE, height: height }, parentOrigin);
      }
    });
  }
  function rememberPlayerFocus() {
    if (modal) return;
    const active = document.activeElement;
    playerFocusAction = active && screen.contains(active) && active.dataset.action
      ? active.dataset.action : (controlsVisible ? 'mode' : 'show');
  }
  function playbackRoute() {
    return mode === 'quick' ? 'quick' : (savedQuick !== null ? 'source' : 'entry');
  }
  function format(seconds) {
    const value = Math.max(0, Math.floor(seconds));
    return String(Math.floor(value / 60)).padStart(2, '0') + ':' + String(value % 60).padStart(2, '0');
  }
  function duration() { return episodeInfo[episode][mode]; }
  function segments() {
    const qScale = episodeInfo[episode].quick / 720;
    const oScale = episodeInfo[episode].original / 2700;
    return baseSegments.map(function (s) {
      return { q0: Math.round(s.q0 * qScale), q1: Math.round(s.q1 * qScale), o0: Math.round(s.o0 * oScale), context: Math.round(s.context * oScale) };
    });
  }
  function quickToSource(q) {
    const list = segments();
    const s = list.find(function (item) { return q < item.q1; }) || list[list.length - 1];
    return { current: Math.min(episodeInfo[episode].original, s.o0 + q - s.q0), context: s.context };
  }
  function sourceToQuick(o) {
    const list = segments();
    for (const s of list) {
      if (o < s.o0) return s.q0;
      if (o <= s.o0 + s.q1 - s.q0) return s.q0 + o - s.o0;
    }
    return Math.max(0, episodeInfo[episode].quick - 1);
  }
  function button(action, label, primary) {
    return '<button type="button" class="tv-button' + (primary ? ' primary' : '') + '" data-action="' + action + '" data-tv-focus>' + label + '</button>';
  }
  function dialog(content) {
    overlay.innerHTML = '<section class="tv-dialog" role="dialog" aria-modal="true" aria-labelledby="tcl-dialog-title">' + content + '</section>';
    overlay.hidden = false;
    icons();
  }
  function visibleFocusables() {
    const area = modal ? overlay : screen;
    return Array.from(area.querySelectorAll('[data-tv-focus]')).filter(function (el) { return el.getClientRects().length > 0 && !el.disabled && !el.closest('[inert]'); });
  }
  function focusElement(element, realFocus) {
    if (!element || element.disabled || !element.getClientRects().length || element.closest('[inert]')) return;
    root.querySelectorAll('.tv-focused').forEach(function (el) { el.classList.remove('tv-focused'); });
    element.classList.add('tv-focused');
    if (realFocus) element.focus({ preventScroll: true });
  }
  function focusAction(action) {
    requestAnimationFrame(function () {
      if (destroyed) return;
      const area = modal ? overlay : screen;
      focusElement(area.querySelector('[data-action="' + action + '"]'), true);
    });
  }
  function focusPlayback() {
    focusAction(controlsVisible ? (modeButton.disabled ? 'play' : 'mode') : 'show');
  }
  function saveModal() {
    if (!modal) return;
    modalStack.push({
      modal: modal,
      markup: overlay.innerHTML,
      route: route,
      focusAction: document.activeElement && document.activeElement.dataset.action,
      focusEpisode: document.activeElement && document.activeElement.dataset.episode
    });
  }
  function returnFromModal() {
    const previous = modalStack.pop();
    if (previous) {
      modal = previous.modal;
      route = previous.route;
      overlay.innerHTML = previous.markup;
      overlay.hidden = false;
      render();
      requestAnimationFrame(function () {
        const target = previous.focusEpisode
          ? overlay.querySelector('[data-episode="' + previous.focusEpisode + '"]')
          : overlay.querySelector('[data-action="' + previous.focusAction + '"]');
        focusElement(target || visibleFocusables()[0], true);
      });
      return;
    }
    closeModal();
    route = playbackRoute();
    render();
    const target = screen.querySelector('[data-action="' + playerFocusAction + '"]');
    if (target && target.getClientRects().length && !target.disabled && !target.closest('[inert]')) {
      focusElement(target, true);
    } else { focusPlayback(); }
  }
  function toast(text) {
    clearTimeout(toastTimer);
    toastElement.textContent = text;
    toastElement.hidden = false;
    toastTimer = setTimeout(function () { toastElement.hidden = true; }, 6500);
  }
  function renderTime() {
    const total = duration();
    position = Math.max(0, Math.min(total, position));
    progress.max = String(total);
    progress.value = String(position);
    progress.style.setProperty('--played', (total ? (position / total) * 100 : 0) + '%');
    progress.setAttribute('aria-valuetext', format(position) + '，共 ' + format(total));
    root.querySelector('#tcl-current-time').textContent = format(position);
    root.querySelector('#tcl-duration').textContent = format(total);
  }
  function render() {
    screen.classList.toggle('has-dialog', !!modal);
    screen.querySelector('.tv-header').inert = !!modal;
    controls.inert = !!modal;
    showButton.inert = !!modal;
    controls.hidden = !controlsVisible;
    showButton.hidden = controlsVisible || !!modal;
    root.querySelector('#tcl-program-meta').textContent = '都市情感 · 第 ' + episode + ' 集';
    root.querySelector('.episode-short').textContent = '第 ' + episode + ' 集';
    modeLabel.textContent = mode === 'quick' ? 'AI 快剪' : '原片';
    modeLabel.classList.toggle('is-quick', mode === 'quick');
    modeDescription.textContent = mode === 'quick'
      ? '精简版 · 随时切回原片'
      : ((playing ? '原片播放中' : '原片已暂停') + (savedQuick !== null ? ' · 已保留快剪进度' : ''));
    if (mode === 'quick') {
      modeButton.innerHTML = '<i data-icon="film" aria-hidden="true"></i><span><strong>切回原片</strong><small>从本段前文继续</small></span>';
    } else if (savedQuick !== null) {
      modeButton.innerHTML = '<i data-icon="sparkles" aria-hidden="true"></i><span><strong>返回快剪</strong><small>接着 ' + format(savedQuick) + ' 观看</small></span>';
    } else if (!episodeInfo[episode].quick) {
      modeButton.innerHTML = '<span><strong>本集暂无快剪</strong><small>可继续观看原片</small></span>';
    } else {
      modeButton.innerHTML = '<i data-icon="sparkles" aria-hidden="true"></i><span><strong>AI 快剪</strong><small>' + Math.round(episodeInfo[episode].quick / 60) + ' 分钟看本集</small></span>';
    }
    modeButton.disabled = !episodeInfo[episode].quick;
    playButton.innerHTML = '<i data-icon="' + (playing ? 'pause' : 'play') + '" aria-hidden="true"></i><span>' + (playing ? '暂停' : '播放') + '</span>';
    subtitle.textContent = mode === 'quick' ? '原来，你一直都记得。' : '有些话，总要当面说清楚。';
    subtitle.hidden = !!modal;
    root.querySelectorAll('[data-route]').forEach(function (el) { el.setAttribute('aria-pressed', String(el.dataset.route === route)); });
    renderTime();
    icons();
    reportHeight();
  }
  function closeModal() {
    modal = null;
    modalStack = [];
    overlay.hidden = true;
    overlay.innerHTML = '';
    render();
  }
  function openIntro() {
    rememberPlayerFocus();
    modal = 'intro';
    route = 'intro';
    const quickStart = sourceToQuick(position);
    const remaining = Math.ceil((episodeInfo[episode].quick - quickStart) / 60);
    dialog('<div class="dialog-eyebrow">AI 快剪</div>' +
      '<h3 id="tcl-dialog-title">时间少一点，剧情接得上。</h3>' +
      '<p class="dialog-copy">保留主要剧情和关键对话，精简重复片段。<br>部分细节会省略，你可以随时切回原片。</p>' +
      '<div class="duration-comparison"><div><div class="duration-label">本集原片</div><span class="duration-number">' + Math.round(episodeInfo[episode].original / 60) + '</span><span class="duration-unit">分钟</span></div><span class="arrow">→</span><div class="short-duration"><div class="duration-label">AI 快剪</div><span class="duration-number">' + Math.round(episodeInfo[episode].quick / 60) + '</span><span class="duration-unit">分钟</span></div></div>' +
      '<p class="resume-note">从当前剧情继续 · 快剪还剩约 ' + remaining + ' 分钟</p>' +
      '<div class="dialog-actions">' + button('start-quick', '开始快剪', true) + button('continue-original', '继续原片', false) + '</div>');
    render();
    focusAction('start-quick');
  }
  function startQuick(fromStart) {
    if (!episodeInfo[episode].quick) { toast('本集暂无快剪，可继续观看原片'); return; }
    const target = fromStart ? 0 : (savedQuick !== null ? savedQuick : sourceToQuick(position));
    mode = 'quick';
    position = target;
    savedQuick = null;
    introduced = true;
    playing = true;
    controlsVisible = true;
    route = 'quick';
    closeModal();
    toast('已进入 AI 快剪 · 可随时切回原片');
    focusAction('mode');
  }
  function switchToOriginal() {
    const mapped = quickToSource(position);
    savedQuick = position;
    mode = 'original';
    position = mapped.context;
    route = 'source';
    playing = true;
    controlsVisible = true;
    render();
    toast('已切回原片 · 从本段前文 ' + format(position) + ' 开始');
    focusAction('mode');
  }
  function endScreen() {
    playing = false;
    modal = 'end';
    modalStack = [];
    route = 'end';
    position = duration();
    const next = episode + 1;
    const nextInfo = episodeInfo[next];
    const hasQuick = nextInfo && nextInfo.quick > 0;
    const keepQuick = mode === 'quick' && hasQuick;
    const nextDescription = nextInfo
      ? (keepQuick ? 'AI 快剪 ' + Math.round(nextInfo.quick / 60) + ' 分钟 · 原片 ' + Math.round(nextInfo.original / 60) + ' 分钟' : '原片 ' + Math.round(nextInfo.original / 60) + ' 分钟' + (mode === 'quick' ? ' · 本集暂无快剪' : ''))
      : '已到达本次演示的最后一集';
    const nextTitle = nextInfo ? '好好生活 · 第 ' + next + ' 集' : '继续探索其他剧集';
    dialog('<div class="dialog-eyebrow">' + (mode === 'quick' ? '本集快剪已看完' : '本集原片已看完') + '</div>' +
      '<h3 id="tcl-dialog-title">接着看，还是慢慢回味？</h3>' +
      '<div class="next-episode"><span class="next-label">接下来</span><strong>' + nextTitle + '</strong><small>' + nextDescription + '</small></div>' +
      '<div class="dialog-actions">' + button(nextInfo ? 'next' : 'episodes', nextInfo ? (keepQuick ? '下一集快剪' : '下一集原片') : '选集', true) + button('replay-original', '看本集原片', false) + '</div>' +
      '<div class="end-secondary"><button type="button" data-action="episodes" data-tv-focus>选集</button></div>');
    render();
    focusAction(nextInfo ? 'next' : 'episodes');
  }
  function openEpisodes() {
    if (modal === 'confirm-original') { returnFromModal(); return; }
    rememberPlayerFocus();
    const returnLabel = modal === 'end' ? '返回播完页' : (modal === 'details' ? '返回详情' : '返回播放');
    saveModal();
    modal = 'episodes';
    dialog('<div class="dialog-eyebrow">好好生活</div><h3 id="tcl-dialog-title">选择剧集</h3>' +
      '<div class="episode-grid">' +
      '<button type="button" class="tv-button" data-episode="8" data-tv-focus><strong>第 8 集</strong><small>快剪 12 分钟</small></button>' +
      '<button type="button" class="tv-button" data-episode="9" data-tv-focus><strong>第 9 集</strong><small>快剪 11 分钟</small></button>' +
      '<button type="button" class="tv-button" data-episode="10" data-tv-focus><strong>第 10 集</strong><small>仅原片 · 45 分钟</small></button></div>' +
      '<div class="end-secondary"><button type="button" data-action="close" data-tv-focus>' + returnLabel + '</button></div>');
    render();
    requestAnimationFrame(function () { focusElement(overlay.querySelector('[data-episode="' + episode + '"]'), true); });
  }
  function selectEpisode(number, targetMode) {
    if (!episodeInfo[number]) return;
    if (targetMode === 'quick' && !episodeInfo[number].quick) targetMode = 'original';
    episode = number;
    savedQuick = null;
    mode = targetMode;
    position = 0;
    playing = true;
    controlsVisible = true;
    route = mode === 'quick' ? 'quick' : 'entry';
    closeModal();
    toast('开始播放第 ' + episode + ' 集 · ' + (mode === 'quick' ? 'AI 快剪' : '原片'));
    focusAction('play');
  }
  function openDetails() {
    rememberPlayerFocus();
    modalStack = [];
    modal = 'details';
    playing = false;
    dialog('<div class="dialog-eyebrow">剧集详情</div><h3 id="tcl-dialog-title">好好生活</h3>' +
      '<p class="dialog-copy">第 ' + episode + ' 集 · ' + (mode === 'quick' ? '快剪' : '原片') + ' 已看到 ' + format(position) + '<br>观看进度已为你保留。</p>' +
      '<div class="dialog-actions">' + button('resume-player', position >= duration() ? '重新播放' : '继续播放', true) + button('episodes', '选集', false) + '</div>');
    render();
    focusAction('resume-player');
  }
  function back() {
    if (modal === 'end') { openDetails(); return; }
    if (modal === 'details') {
      // The preview has no outer TV home page; return keyboard control to its route picker.
      root.querySelector('[data-route="entry"]').focus({ preventScroll: true });
      toast('已退出播放器操作 · 可选择上方页面继续体验');
      return;

    } else {
      openDetails();
    }
  }

    }

    if (action === 'show') { controlsVisible = true; render(); focusPlayback(); }
    if (action === 'replay-original') selectEpisode(episode, 'original');

      selectEpisode(next, targetMode);
    }
  }
  function setRoute(value) {
    clearTimeout(toastTimer);
    toastElement.hidden = true;
    episode = 8; mode = 'original'; position = 638; savedQuick = null;
    playing = true; controlsVisible = true; route = value; modal = null; modalStack = [];
    overlay.hidden = true; overlay.innerHTML = '';
    if (value === 'intro') { openIntro(); return; }
    if (value === 'quick') { mode = 'quick'; position = 134; introduced = true; }
    if (value === 'source') { mode = 'quick'; position = 134; introduced = true; switchToOriginal(); return; }
    if (value === 'end') { mode = 'quick'; introduced = true; endScreen(); return; }
    if (value === 'entry') introduced = false;

  }
  root.addEventListener('click', function (event) {

      const number = Number(episodeButton.dataset.episode);
      if (number === 10 && mode === 'quick') {
        saveModal();
        modal = 'confirm-original';
        dialog('<div class="dialog-eyebrow">观看模式</div><h3 id="tcl-dialog-title">第 10 集暂无快剪</h3><p class="dialog-copy">你可以观看本集原片，片长 45 分钟。</p><div class="dialog-actions">' + button('confirm-original', '播放原片', true) + button('episodes', '返回选集', false) + '</div>');
        render(); focusAction('episodes');
      } else {
        selectEpisode(number, mode === 'quick' && episodeInfo[number].quick ? 'quick' : 'original');
      }
      return;
    }
    const actionButton = event.target.closest('[data-action]');
    if (actionButton) activate(actionButton.dataset.action);
  });
  root.addEventListener('focusin', function (event) {
    if (event.target.matches('[data-tv-focus]')) {
      if (modal && !overlay.contains(event.target)) { focusElement(visibleFocusables()[0], true); return; }
      focusElement(event.target, false);
    }
  });
  progress.addEventListener('input', function () {
    position = Number(progress.value);
    if (position >= duration()) { endScreen(); return; }
    renderTime();
  });
  root.addEventListener('keydown', function (event) {
    const routeButton = event.target.closest('[data-route]');
    if (routeButton) {
      const routes = Array.from(root.querySelectorAll('[data-route]'));
      const index = routes.indexOf(routeButton);
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight' || event.key === 'Home' || event.key === 'End') {
        event.preventDefault();
        const target = event.key === 'Home' ? 0 : event.key === 'End' ? routes.length - 1
          : (index + (event.key === 'ArrowRight' ? 1 : -1) + routes.length) % routes.length;
        routes[target].focus({ preventScroll: true });
      }
      return;
    }
    if (event.key === 'Escape') { event.preventDefault(); back(); return; }
    if (event.key === 'Tab' && modal) {
      const items = visibleFocusables();
      const current = items.indexOf(document.activeElement);
      if (!items.length) { event.preventDefault(); return; }
      if (current < 0 || (!event.shiftKey && current === items.length - 1) || (event.shiftKey && current === 0)) {
        event.preventDefault();
        focusElement(event.shiftKey ? items[items.length - 1] : items[0], true);
      }
      return;
    }
    const directions = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
    if (!directions.includes(event.key) || event.target.closest('[data-route]')) return;
    event.preventDefault();
    if (document.activeElement === progress && (event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
      position = Math.max(0, Math.min(duration(), position + (event.key === 'ArrowRight' ? 10 : -10)));
      if (position === duration()) endScreen(); else renderTime();
      return;
    }
    const items = visibleFocusables();
    const current = items.includes(document.activeElement) ? document.activeElement : items[0];
    if (!current) return;
    const r = current.getBoundingClientRect();
    const cx = r.x + r.width / 2, cy = r.y + r.height / 2;
    const vertical = event.key === 'ArrowUp' || event.key === 'ArrowDown';
    const sign = event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -1 : 1;
    const candidates = items.filter(function (el) { return el !== current; }).map(function (el) {
      const b = el.getBoundingClientRect();
      const dx = b.x + b.width / 2 - cx, dy = b.y + b.height / 2 - cy;
      const primary = vertical ? dy : dx, secondary = vertical ? dx : dy;
      return { el: el, primary: primary * sign, score: Math.abs(primary) + 2.5 * Math.abs(secondary) };
    }).filter(function (item) { return item.primary > 8; }).sort(function (a, b) { return a.score - b.score; });
    if (candidates.length) focusElement(candidates[0].el, true);
  });
  function startTimer() {
    if (playbackTimer !== null || destroyed) return;
    playbackTimer = setInterval(function () {
      if (!root.isConnected) { cleanup(); return; }
      if (!playing || modal || document.hidden || !inViewport) return;
      position = Math.min(duration(), position + 1);
      if (position >= duration()) endScreen(); else renderTime();
    }, 1000);
  }
  function stopTimer() {
    clearInterval(playbackTimer);
    playbackTimer = null;
  }
  const heightObserver = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(reportHeight) : null;
  if (heightObserver) heightObserver.observe(demoPage);
  const visibilityObserver = typeof IntersectionObserver !== 'undefined'
    ? new IntersectionObserver(function (entries) { inViewport = entries[0].isIntersecting; }, { threshold: 0.01 })
    : null;
  if (visibilityObserver) visibilityObserver.observe(root);
  function cleanup() {
    destroyed = true;
    stopTimer();
    clearTimeout(toastTimer);
    if (heightFrame !== null) cancelAnimationFrame(heightFrame);
    heightFrame = null;
    if (heightObserver) heightObserver.disconnect();
    if (visibilityObserver) visibilityObserver.disconnect();
  }
  window.addEventListener('pagehide', function (event) {
    stopTimer();
    clearTimeout(toastTimer);
    if (!event.persisted) cleanup();
  });
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) { startTimer(); lastReportedHeight = 0; reportHeight(); }
  });
  window.addEventListener('resize', reportHeight, { passive: true });
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent || (parentOrigin !== '*' && event.origin !== parentOrigin)) return;
    if (event.data && event.data.type === 'tcl-quickcut:measure') {
      lastReportedHeight = 0;
      reportHeight();
    }
  });
  render();
  startTimer();
  reportHeight();
})();
</script>
